<style>
/* ═══════════════════════════════════════════════════════════════════
   AURORA — phase-reactive design system

   The palette is not a theme the user picks; it is a function of where
   she is in her cycle. Four phases x light/dark, written to :root at
   runtime. Everything else reads from these tokens.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --g1:#FFF1E8; --g2:#FFE3DE; --g3:#F0CFE6;      /* gradient stops   */
  --a1:#FFB39C; --a2:#C9A7F0;                      /* aura blobs      */
  --accent:#A8486B; --accent-ink:#FFFFFF;
  --ink:#2B1B24; --ink-2:#6E5560; --ink-3:#9C8490;
  --card:rgba(255,255,255,.58); --card-line:rgba(255,255,255,.85);
  --nav:rgba(43,27,36,.84); --nav-ink:rgba(255,255,255,.55);
  --fill:rgba(43,27,36,.07);
  --period:#C43E63; --fertile:#3FAF96; --ovul:#2F7FD6; --idle:rgba(43,27,36,.12);

  --sp:cubic-bezier(.32,.72,0,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --ui:'Inter Tight',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--ui);
  font-size:16px;
  color:var(--ink);
  background:var(--g2);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#app{height:100%}
input,textarea,button{font:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer;-webkit-appearance:none;color:inherit}
::-webkit-scrollbar{display:none}
::placeholder{color:var(--ink-3)}

/* ── The living backdrop ─────────────────────────────────────── */
.stage{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(168deg,var(--g1) 0%,var(--g2) 42%,var(--g3) 100%);
  transition:background 1.1s var(--sp);
}
.aura{position:absolute;border-radius:50%;filter:blur(58px);will-change:transform;
  transition:background 1.1s var(--sp)}
.aura-1{width:340px;height:340px;background:var(--a1);opacity:.72;top:-100px;right:-120px}
.aura-2{width:300px;height:300px;background:var(--a2);opacity:.6;bottom:100px;left:-130px}
/* Grain keeps the gradients from banding and reads as paper, not plastic */
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.38;
  mix-blend-mode:overlay}

.screen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;padding:0 20px}
.pad-nav{height:calc(96px + var(--safe-b))}

/* ── Type ────────────────────────────────────────────────────── */
.kicker{font-size:10.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase}
.hero-n{
  font-family:var(--display);font-weight:300;font-size:132px;line-height:.78;
  letter-spacing:-6px;font-variation-settings:'opsz' 144;
  /* depth: a single soft drop, no bevels */
  text-shadow:0 2px 20px rgba(0,0,0,.09);
}
.serif{font-family:var(--display);font-weight:400;font-variation-settings:'opsz' 36}

/* ── Surfaces ────────────────────────────────────────────────── */
.card{
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:26px;padding:19px 20px;
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  backdrop-filter:blur(20px) saturate(170%);
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 10px 30px rgba(0,0,0,.07);
}
.card+.card{margin-top:12px}

/* A dated note reads as a letter: warmer ground, a soft edge glow, and a
   living dot so it is obviously of-this-moment rather than permanent UI. */
.letter{
  background:linear-gradient(150deg,var(--accent-wash),var(--card) 62%);
  border:1px solid var(--card-line);
  border-radius:28px;padding:22px 21px;
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  backdrop-filter:blur(20px) saturate(170%);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 14px 38px rgba(0,0,0,.1);
}
.letter-pulse{
  width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;
  animation:breathe 2.8s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.72)}
}

.pill{
  padding:12px 16px;border-radius:19px;background:var(--card);
  border:1px solid var(--card-line);font-size:14.5px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .13s var(--sp);
}
.pill:active{transform:scale(.95)}
.pill-solid{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.chip{
  padding:9px 14px;border-radius:999px;background:var(--fill);
  font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;
  align-items:center;gap:7px;transition:transform .13s var(--sp),background .16s ease;
}
.chip:active{transform:scale(.94)}
.chip[data-on="1"]{background:var(--accent);color:var(--accent-ink)}

/* ── Cycle strip ─────────────────────────────────────────────── */
.strip{display:flex;gap:3px;align-items:flex-end;height:64px}
.strip button{flex:1;border-radius:3px;min-width:0;position:relative;
  transition:transform .16s var(--sp)}
.strip button:active{transform:scaleY(1.12)}
.strip .today-mark{position:absolute;left:50%;transform:translateX(-50%);
  bottom:-9px;width:4px;height:4px;border-radius:50%;background:var(--ink)}

/* ── Floating nav ────────────────────────────────────────────── */
.nav{
  position:fixed;bottom:calc(var(--safe-b) + 14px);left:20px;right:20px;height:62px;
  border-radius:24px;display:flex;align-items:center;justify-content:space-around;
  z-index:40;background:var(--nav);color:var(--nav-ink);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;
  transition:transform .13s var(--sp)}
.nav button:active{transform:scale(.9)}
.nav svg{width:21px;height:21px;display:block}
.nav span{font-size:9.5px;font-weight:600}
.nav [data-on="1"]{color:var(--nav-active)}

/* ── Sheet ───────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fade .26s ease both}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:90vh;
  background:linear-gradient(170deg,var(--g1),var(--g2));
  border-radius:30px 30px 0 0;border-top:1px solid var(--card-line);
  padding:8px 20px calc(var(--safe-b) + 18px);
  display:flex;flex-direction:column;
  animation:sheetUp .46s var(--sp) both;
}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--ink-3);
  margin:0 auto 14px;flex:none;opacity:.5}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);z-index:80;
  transform:translateX(-50%);max-width:calc(100% - 44px);
  background:rgba(28,20,25,.93);color:#fff;padding:12px 19px;border-radius:999px;
  font-size:14px;font-weight:500;text-align:center;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 10px 34px rgba(0,0,0,.28);
  animation:toastIn .42s var(--sp) both;
}

/* ── Calendar ────────────────────────────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--ink-3);padding:5px 0}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:14.5px;font-weight:500;position:relative;
  transition:transform .13s var(--sp)}
.day:active{transform:scale(.88)}
.day[data-today="1"]{font-weight:700}
.day[data-sel="1"]{box-shadow:0 0 0 2px var(--ink)}
.day .dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%}

/* ── Chat ────────────────────────────────────────────────────── */
.bubble{max-width:78%;padding:11px 16px;border-radius:21px;font-size:16px;
  line-height:1.38;white-space:pre-wrap;word-wrap:break-word;
  animation:pop .32s var(--sp) both}
.bubble-me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);
  border-bottom-right-radius:7px}
.bubble-ai{align-self:flex-start;background:var(--card);border:1px solid var(--card-line);
  border-bottom-left-radius:7px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.92)}
                   to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(6px)}
               to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}
                to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(.15);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.rise{animation:rise .5s var(--sp) both}
.r1{animation-delay:.05s}.r2{animation-delay:.1s}.r3{animation-delay:.16s}
.r4{animation-delay:.22s}.r5{animation-delay:.28s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<div class="stage"><div class="aura aura-1"></div><div class="aura aura-2"></div></div>
<svg class="grain" aria-hidden="true">

    <feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)" opacity=".5"/>
</svg>
<div id="app"></div>

<script>
const { h, render } = preact;
const { useState, useEffect, useRef, useCallback, useMemo } = preactHooks;
const html = htm.bind(h);

/* ── Date helpers — COPIED VERBATIM from the original app.
      dk() must stay LOCAL-time or every stored key shifts a day. ── */
const dk = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const dBetween = (a,b) => Math.round((b-a)/86400000);
const addD = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const sameD = (a,b) => a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

const MONTH_FULL = ["January","February","March","April","May","June","July",
                    "August","September","October","November","December"];
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["S","M","T","W","T","F","S"];

/* ═══ Domain ══════════════════════════════════════════════════
   MOOD LABELS AND FLOW IDS ARE STORAGE VALUES. Renaming one
   orphans every past log. Add freely; never rename.           */
const MOODS = [
  { label:"Happy"     }, { label:"Loved"     }, { label:"Calm"      },
  { label:"Tired"     }, { label:"Sad"       }, { label:"Anxious"   },
  { label:"Irritated" }, { label:"Emotional" }, { label:"Energetic" },
  { label:"Romantic"  }, { label:"Nauseous"  }, { label:"Strong"    },
];
const SYMPTOMS = ["Cramps","Bloating","Headache","Back Pain","Breast Tenderness",
  "Acne","Fatigue","Insomnia","Cravings","Dizziness","Nausea","Hot Flashes"];
const FLOWS = [
  { id:"spotting", label:"Spotting", o:.30 },
  { id:"light",    label:"Light",    o:.50 },
  { id:"medium",   label:"Medium",   o:.72 },
  { id:"heavy",    label:"Heavy",    o:.88 },
  { id:"super",    label:"Super",    o:1   },
];
const NON_PERIOD = ["none","discharge"];
const isPeriodFlow = (f) => !!f && NON_PERIOD.indexOf(f) === -1;

const NICKNAMES = ["Gul Jaane","Lalay","Gudai","Zargo","Momal","Gul"];
const nick = () => NICKNAMES[Math.floor(Math.random()*NICKNAMES.length)];

/* ── Notes from Afaq, chosen by how she actually feels ──────── */
const LOVE_GENERAL = [
  "I would choose you in a hundred lifetimes.",
  "You are the poetry my soul was trying to write.",
  "You are home. You are peace. You are everything.",
  "Every day I fall in love with you more than the day before.",
  "Your smile cures everything wrong with the world.",
  "You are so rare, so precious, so irreplaceable.",
  "Everything good in my life leads back to you.",
  "You are the calm in my storm, always.",
  "You are my favourite person on this entire planet.",
  "Being yours is the greatest honour of my life.",
  "You make ordinary moments feel magical.",
  "Just knowing you exist makes the world feel okay.",
  "My heart has never felt this full — that's all you.",
  "You are the dream I never want to wake up from.",
  "I love the way you love. It's the most beautiful thing.",
];
const LOVE_SOFT = [
  "It's okay. I'm right here with you. You don't have to be strong right now.",
  "Even on your hardest days, you are so deeply loved.",
  "Cry if you need to. I'll be here through all of it.",
  "Your pain is real and I see it. You are never alone.",
  "Rest. Breathe. I love you in every version of yourself.",
  "The storm will pass. And I'll be here when it does.",
  "You don't have to pretend to be okay. I love you as you are right now.",
];
const LOVE_REST = [
  "Rest today. You've absolutely earned it.",
  "Take it slow. I wish I could take all your pain away.",
  "Your body is working so hard right now. Be gentle with it.",
  "Warm water, a heating pad, and love from me every second.",
  "You don't have to be okay right now. Let your body rest.",
  "Period pain is real and brutal. You deserve all the rest in the world.",
];
/* ── Dated notes ───────────────────────────────────────────────
   A note from Afaq pinned to a specific window of time. It appears
   above everything on Today while it is live, then disappears on its
   own — nothing to dismiss, nothing to clean up later.

   `from` and `until` are LOCAL time (no Z), matching dk() elsewhere.
   To add one: copy the shape, set the window, write the lines.      */
const DATED_NOTES = [
  {
    id: 'mdcat-2026',
    from:  '2026-09-19T00:00',
    until: '2026-09-20T08:00',
    label: 'A note for today',
    open:  'Hey — I miss you a lot.',
    lines: [
      "Good luck for your MDCAT tomorrow. You've worked so hard for this, and I've watched you do it.",
      "Don't panic. You know more than you think you do — just read each question properly and trust yourself.",
      "I've made a lot of dua for you.",
    ],
    arabic: 'رَبِّ زِدْنِي عِلْمًا',
    translit: 'Rabbi zidni ilma',
    meaning: 'My Lord, increase me in knowledge',
    close: 'May Allah be with you.',
    sign: '— Afaq',
  },
];
function activeDatedNote(now){
  for (const n of DATED_NOTES){
    const a = new Date(n.from), b = new Date(n.until);
    if (!isNaN(a) && !isNaN(b) && now >= a && now < b) return n;
  }
  return null;
}

const SOFT_MOODS = ["Sad","Anxious","Emotional","Tired"];
const REST_MOODS = ["Nauseous","Irritated"];
function loveFor(moods, onPeriod){
  const m = moods || [];
  if (m.some(x=>REST_MOODS.includes(x)) || onPeriod) return LOVE_REST;
  if (m.some(x=>SOFT_MOODS.includes(x))) return LOVE_SOFT;
  return LOVE_GENERAL;
}

/* ═══ Phase palettes ══════════════════════════════════════════
   Four phases x light/dark. Contrast of --ink on --g2 was checked
   against WCAG AA (>=4.5:1) for every combination.             */
const PHASES = {
  menstrual:{ label:"Menstrual",
    light:{ g1:"#FFF2F4",g2:"#FFDCE4",g3:"#F6BDCE",a1:"#FF9DB4",a2:"#E0A8C8",
            accent:"#A3123F",accentInk:"#FFFFFF",ink:"#33101C",ink2:"#7A4354",ink3:"#A87D8B",
            card:"rgba(255,255,255,.62)",line:"rgba(255,255,255,.9)",
            nav:"rgba(51,16,28,.86)",fill:"rgba(51,16,28,.07)" },
    dark:{  g1:"#160810",g2:"#2B0C1B",g3:"#421128",a1:"#B01748",a2:"#6E1A3E",
            accent:"#FF6E92",accentInk:"#2A0812",ink:"#FDEEF2",ink2:"#C99AAC",ink3:"#8F6A78",
            card:"rgba(255,255,255,.08)",line:"rgba(255,255,255,.14)",
            nav:"rgba(255,255,255,.1)",fill:"rgba(255,255,255,.1)" } },
  follicular:{ label:"Follicular",
    light:{ g1:"#FFFDF0",g2:"#F2F7DC",g3:"#DCEFD6",a1:"#E8E98F",a2:"#A8DCB4",
            accent:"#2F7A4E",accentInk:"#FFFFFF",ink:"#16301F",ink2:"#4E6A56",ink3:"#86A08E",
            card:"rgba(255,255,255,.62)",line:"rgba(255,255,255,.9)",
            nav:"rgba(22,48,31,.86)",fill:"rgba(22,48,31,.07)" },
    dark:{  g1:"#08130C",g2:"#0F2417",g3:"#173624",a1:"#2E7A4A",a2:"#1C5236",
            accent:"#6FD18F",accentInk:"#06170D",ink:"#EDFBF1",ink2:"#9DC4AA",ink3:"#6D9079",
            card:"rgba(255,255,255,.07)",line:"rgba(255,255,255,.13)",
            nav:"rgba(255,255,255,.1)",fill:"rgba(255,255,255,.1)" } },
  ovulation:{ label:"Ovulation",
    light:{ g1:"#F0FCFC",g2:"#D9F2F1",g3:"#CDE7F8",a1:"#8FE3DC",a2:"#9CC9F0",
            accent:"#0B6E7C",accentInk:"#FFFFFF",ink:"#0B2A30",ink2:"#3F6B73",ink3:"#7A9DA4",
            card:"rgba(255,255,255,.64)",line:"rgba(255,255,255,.92)",
            nav:"rgba(11,42,48,.86)",fill:"rgba(11,42,48,.07)" },
    dark:{  g1:"#041217",g2:"#072028",g3:"#0A3140",a1:"#0E6C7C",a2:"#12485E",
            accent:"#45D3DA",accentInk:"#032027",ink:"#E9FBFC",ink2:"#93BEC5",ink3:"#65898F",
            card:"rgba(255,255,255,.07)",line:"rgba(255,255,255,.13)",
            nav:"rgba(255,255,255,.1)",fill:"rgba(255,255,255,.1)" } },
  luteal:{ label:"Luteal",
    light:{ g1:"#FFF3EA",g2:"#FFE3DD",g3:"#F1D0E7",a1:"#FFB49E",a2:"#CBA9EE",
            accent:"#8E3B62",accentInk:"#FFFFFF",ink:"#2B1A24",ink2:"#6B5060",ink3:"#9A8190",
            card:"rgba(255,255,255,.6)",line:"rgba(255,255,255,.9)",
            nav:"rgba(43,26,36,.86)",fill:"rgba(43,26,36,.07)" },
    dark:{  g1:"#120A13",g2:"#220F24",g3:"#371638",a1:"#7A2A6A",a2:"#4A1E52",
            accent:"#E88FC0",accentInk:"#240F22",ink:"#FBEFF8",ink2:"#C4A0BA",ink3:"#8C7186",
            card:"rgba(255,255,255,.08)",line:"rgba(255,255,255,.14)",
            nav:"rgba(255,255,255,.1)",fill:"rgba(255,255,255,.1)" } },
};
/* Cycle-day colours stay constant so the strip reads the same in every phase */
const DAYCOL = { period:"#D13D67", fertile:"#37A88F", ovul:"#3B86D6" };

function phaseOf(pred, day, onPeriod){
  if (onPeriod) return 'menstrual';
  if (!pred.last || !day) return 'luteal';
  if (pred.ovDay){
    const today = new Date();
    if (sameD(today, pred.ovDay)) return 'ovulation';
    if (pred.fertile && today >= pred.fertile.start && today <= pred.fertile.end) return 'ovulation';
    if (today < pred.fertile.start) return 'follicular';
  }
  return 'luteal';
}

/* ═══ Storage — see DATA_CONTRACT.md before changing anything ══ */
function useLS(key, def){
  const [v,setV] = useState(() => {
    try { const s = localStorage.getItem(`gc_${key}`); return s ? JSON.parse(s) : def; }
    catch { return def; }
  });
  useEffect(()=>{ try{ localStorage.setItem(`gc_${key}`, JSON.stringify(v)); }catch{} },[key,v]);
  return [v,setV];
}
const BACKUP_KEYS = ["gc_pLogs","gc_mLogs","gc_sLogs","gc_notes","gc_weight","gc_chat",

/* One-time safety net: snapshot everything before this version's first
   run, so a bad migration is always recoverable from her own device. */
(function snapshotOnce(){
  try{
    if (localStorage.getItem('gc_backup_pre_v2')) return;
    const snap = {};
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if (k && k.indexOf('gc_')===0 && k !== 'gc_backup_pre_v2') snap[k] = localStorage.getItem(k);
    }
    if (Object.keys(snap).length)
      localStorage.setItem('gc_backup_pre_v2', JSON.stringify({ at:new Date().toISOString(), data:snap }));
  }catch{}
})();

/* ═══ Prediction — preserved from the original ════════════════ */
function predict(logs){
  const sorted = Object.keys(logs).filter(k=>isPeriodFlow(logs[k]&&logs[k].flow)).sort();
  if (!sorted.length) return { next:null,fertile:null,ovDay:null,avg:28,cycles:[],last:null,runLen:5 };
  const starts=[]; let cur=sorted[0], prev=sorted[0];
  for (let i=1;i<sorted.length;i++){
    if (dBetween(pd(prev), pd(sorted[i])) > 3){ starts.push(cur); cur=sorted[i]; }
    prev=sorted[i];
  }
  starts.push(cur);
  const cycles=[];
  for (let i=1;i<starts.length;i++) cycles.push(dBetween(pd(starts[i-1]),pd(starts[i])));
  let avg=28;
  if (cycles.length){
    const w=cycles.map((_,i)=>i+1), ws=w.reduce((a,b)=>a+b,0);
    avg=Math.round(cycles.reduce((s,c,i)=>s+c*w[i],0)/ws);
  }
  /* average bleed length, for "day 2 of about 5" */
  let runs=[], run=1;
  for (let i=1;i<sorted.length;i++){
    if (dBetween(pd(sorted[i-1]),pd(sorted[i]))===1) run++;
    else { runs.push(run); run=1; }
  }
  runs.push(run);
  const runLen = Math.max(3, Math.round(runs.reduce((a,b)=>a+b,0)/runs.length));
  const last=pd(starts[starts.length-1]);
  const next=addD(last,avg), ov=addD(next,-14);
  return { next, fertile:{start:addD(ov,-5),end:addD(ov,1)}, ovDay:ov, avg, cycles, last, runLen };
}

/* ═══ Toast ═══════════════════════════════════════════════════ */
function useToast(){
  const [m,setM] = useState(null); const t = useRef(null);
  const show = useCallback((msg)=>{ setM(msg); clearTimeout(t.current);
    t.current = setTimeout(()=>setM(null), 2600); },[]);
  return [m ? html`<div class="toast" role="status">${m}</div>` : null, show];
}

/* ═══ Sheet ═══════════════════════════════════════════════════ */
function Sheet({ open, onClose, children }){
  useEffect(()=>{
    if(!open) return;
    const esc = e => e.key==='Escape' && onClose();
    window.addEventListener('keydown', esc);
    return ()=>window.removeEventListener('keydown', esc);
  },[open,onClose]);
  if(!open) return null;
  return html`
    <div class="scrim" onClick=${onClose}></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grabber"></div>
      <div class="sheet-body">${children}</div>
    </div>`;
}

/* ═══ Cycle strip — the whole month, readable at a glance ═════ */
function CycleStrip({ pred, pLogs, today, onPick }){
  const len = Math.max(pred.avg || 28, 24);
  const start = pred.last || addD(today, -1);
  const cells = [];
  for (let i=0;i<len;i++){
    const d = addD(start, i);
    const k = dk(d);
    const flow = pLogs[k] && pLogs[k].flow;
    const isToday = sameD(d, today);
    /* Baseline is a gentle arc peaking near ovulation, so even unlogged
       days carry rhythm instead of reading as a row of identical dots. */
    const base = 20 + Math.sin(Math.PI * (i/len)) * 16;
    let col = 'var(--idle)', hgt = base, label = '';
    if (isPeriodFlow(flow)){
      col = DAYCOL.period; hgt = 48 + (FLOWS.find(f=>f.id===flow)||{o:.7}).o*44; label='Period';
    } else if (pred.ovDay && sameD(d, pred.ovDay)){
      col = DAYCOL.ovul; hgt = 96; label='Ovulation';
    } else if (pred.fertile && d >= pred.fertile.start && d <= pred.fertile.end){
      const near = Math.abs(dBetween(pred.ovDay, d));
      col = DAYCOL.fertile; hgt = 58 + Math.max(0, 6-near)*5; label='Fertile';
    } else if (pred.next && d >= pred.next){
      col = 'var(--accent)'; hgt = base + 16; label='Predicted';
    }
    cells.push({ d, k, col, hgt: Math.min(Math.max(hgt,14), 100), isToday, label, i });
  }
  return html`
    <div>
      <div class="strip">
        ${cells.map(c => html`
          <button key=${c.k}
            onClick=${()=>onPick(c.d)}
            aria-label=${`${c.d.getDate()} ${MONTH_SHORT[c.d.getMonth()]}${c.label?' · '+c.label:''}`}
            style=${`height:${c.hgt}%;background:${c.isToday?'var(--ink)':c.col};
                     animation:grow .5s var(--sp) both;animation-delay:${c.i*11}ms;
                     transform-origin:bottom`}>
            ${c.isToday && html`<span class="today-mark"></span>`}
          </button>`)}
      </div>
      <div style="display:flex;gap:14px;margin-top:15px;flex-wrap:wrap">
        ${[['Period',DAYCOL.period],['Fertile',DAYCOL.fertile],
           ['Ovulation',DAYCOL.ovul],['Today','var(--ink)']].map(([l,c])=>html`
          <div key=${l} style="display:flex;align-items:center;gap:6px;
               font-size:11px;color:var(--ink-3);font-weight:500">
            <span style=${`width:8px;height:8px;border-radius:2px;background:${c}`}></span>${l}
          </div>`)}
      </div>
    </div>`;
}

/* ═══ Weight ══════════════════════════════════════════════════ */
function WeightChart({ weights, pLogs, unit }){
  const keys = Object.keys(weights).sort();
  if (keys.length < 2) return null;
  const W = 330, H = 104, PADX = 4, PADY = 12;
  const recent = keys.slice(-120);
  const vals = recent.map(k=>weights[k]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = Math.max(max-min, 1);
  const t0 = pd(recent[0]).getTime();
  const t1 = pd(recent[recent.length-1]).getTime();
  const tspan = Math.max(t1-t0, 86400000);
  const X = k => PADX + ((pd(k).getTime()-t0)/tspan)*(W-PADX*2);
  const Y = v => PADY + (1-(v-min)/span)*(H-PADY*2);
  const pts = recent.map(k=>`${X(k).toFixed(1)},${Y(weights[k]).toFixed(1)}`).join(' ');
  /* Period days as soft vertical bands — the whole point is seeing weight
     move WITH her cycle. Contiguous days merge into ONE band; drawing a
     stripe per day reads as noise rather than "this is her period". */
  const pdays = Object.keys(pLogs)
    .filter(k => isPeriodFlow(pLogs[k].flow) && pd(k).getTime()>=t0 && pd(k).getTime()<=t1)
    .sort();
  const bands = [];
  pdays.forEach(k => {
    const x = X(k);
    const prev = bands[bands.length-1];
    if (prev && dBetween(pd(prev.lastK), pd(k)) <= 1){ prev.x2 = x; prev.lastK = k; }
    else bands.push({ x1:x, x2:x, lastK:k });
  });
  const last = weights[recent[recent.length-1]];
  const first = weights[recent[0]];
  const delta = last - first;
  return html`
    <div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
        <div style="font-family:var(--display);font-size:40px;font-weight:300;
             letter-spacing:-1.6px;line-height:1">${last.toFixed(1)}</div>
        <div style="font-size:13px;color:var(--ink-2)">${unit}</div>
        <div style=${`margin-left:auto;font-size:12.5px;font-weight:600;
             color:${Math.abs(delta)<0.15?'var(--ink-3)':(delta>0?'var(--accent)':DAYCOL.fertile)}`}>
          ${delta>0?'+':''}${delta.toFixed(1)} ${unit}</div>
      </div>
      <svg viewBox=${`0 0 ${W} ${H}`} style="width:100%;height:${H}px;overflow:visible"
           aria-label="Weight over time">
        <defs>
          <linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--accent)" stop-opacity=".26"/>
            <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
        </defs>
        ${bands.map((b,i)=>html`<rect key=${i} x=${b.x1-1.5} y="0"
          width=${Math.max(b.x2-b.x1+3, 3)} height=${H} rx="2"
          fill=${DAYCOL.period} opacity=".15"/>`)}
        <polyline points=${`${PADX},${H} ${pts} ${W-PADX},${H}`} fill="url(#wfill)" stroke="none"/>
        <polyline points=${pts} fill="none" stroke="var(--accent)" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx=${X(recent[recent.length-1])} cy=${Y(last)} r="4.5"
          fill="var(--accent)" stroke="var(--g1)" stroke-width="2.4"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;
           color:var(--ink-3);margin-top:4px">
        <span>${MONTH_SHORT[pd(recent[0]).getMonth()]} ${pd(recent[0]).getDate()}</span>
        <span style="color:var(--ink-2)">${min.toFixed(1)}–${max.toFixed(1)} ${unit}</span>
        <span>Today</span>
      </div>
    </div>`;
}

function WeightSheet({ open, onClose, date, weights, setWeights, unit, toast }){
  const k = dk(date);
  const existing = weights[k];
  const [val,setVal] = useState('');
  useEffect(()=>{ if(open) setVal(existing != null ? String(existing) : ''); },[open,existing]);
  const save = () => {
    const n = parseFloat(val);
    if (isNaN(n) || n <= 0 || n > 400){ toast('Enter a weight between 1 and 400'); return; }
    setWeights(w => ({ ...w, [k]: Math.round(n*10)/10 }));
    toast(`Logged ${n.toFixed(1)} ${unit}`); onClose();
  };
  const remove = () => {
    setWeights(w => { const c = {...w}; delete c[k]; return c; });
    toast('Removed'); onClose();
  };
  const step = (d) => {
    const n = parseFloat(val) || (existing ?? 60);
    setVal((Math.round((n+d)*10)/10).toFixed(1));
  };
  return html`
    <${Sheet} open=${open} onClose=${onClose}>
      <div style="font-family:var(--display);font-size:26px;font-weight:400;
           letter-spacing:-.6px;margin-bottom:3px">Weight</div>
      <div style="font-size:13px;color:var(--ink-2);margin-bottom:24px">
        ${date.getDate()} ${MONTH_FULL[date.getMonth()]}</div>

      <div style="display:flex;align-items:center;gap:14px;justify-content:center;
           margin-bottom:26px">
        <button class="pill" style="width:54px;height:54px;border-radius:50%;padding:0;
          font-size:22px" onClick=${()=>step(-0.1)} aria-label="Decrease">−</button>
        <div style="display:flex;align-items:baseline;gap:7px">
          <input value=${val} inputmode="decimal" placeholder="—"
            onInput=${e=>setVal(e.target.value.replace(/[^0-9.]/g,''))}
            style="font-family:var(--display);font-size:56px;font-weight:300;
                   letter-spacing:-2px;width:140px;text-align:center"/>
          <span style="font-size:15px;color:var(--ink-2)">${unit}</span>
        </div>
        <button class="pill" style="width:54px;height:54px;border-radius:50%;padding:0;
          font-size:22px" onClick=${()=>step(0.1)} aria-label="Increase">+</button>
      </div>

      <div style="display:flex;gap:10px">
        ${existing != null && html`
          <button class="pill" style="flex:none;color:var(--accent)" onClick=${remove}>Remove</button>`}
        <button class="pill pill-solid" style="flex:1" onClick=${save}>Save</button>
      </div>
    <//>`;
}

/* ═══ HOME ════════════════════════════════════════════════════ */
function Home({ pred, pLogs, mLogs, weights, unit, today, cycleDay, phase,
                noteSeed, datedNote, onOpenDay, onPickDay, onWeight }){
  const tk = dk(today);
  const flow = pLogs[tk] && pLogs[tk].flow;
  const onPeriod = isPeriodFlow(flow);
  const moods = mLogs[tk] || [];
  const pool = loveFor(moods, onPeriod);
  const note = pool[noteSeed % pool.length];
  const left = pred.next ? dBetween(today, pred.next) : null;

  /* Which day of her bleed is it? */
  let bleedDay = 0;
  if (onPeriod){
    let i = 0;
    while (isPeriodFlow((pLogs[dk(addD(today,-i-1))]||{}).flow)) i++;
    bleedDay = i + 1;
  }

  const hero = onPeriod ? String(bleedDay).padStart(2,'0')
    : left == null ? '—' : left === 0 ? '0' : String(Math.abs(left));
  const heroSub = onPeriod ? html`of about<br/>${pred.runLen} days`
    : left == null ? html`log a period<br/>to begin`
    : left > 0 ? html`days until<br/>your period`
    : left === 0 ? html`your period<br/>is due today` : html`days<br/>late`;

  return html`
    <div class="scroll">
      <div style="height:calc(var(--safe-t) + 14px)"></div>

      <div class="rise" style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div class="kicker" style="color:var(--ink-3)">
            ${today.toLocaleDateString(undefined,{weekday:'long'})} ${today.getDate()} ${MONTH_SHORT[today.getMonth()]}</div>
          <div style="font-size:19px;font-weight:600;letter-spacing:-.4px;margin-top:3px">
            Hi, ${nickStable}</div>
        </div>
        <${Avatar} size=${42}/>
      </div>

      ${/* A live dated note outranks everything — it is time-limited and the
           whole point is that she sees it. It removes itself when it expires. */''}
      <${DatedNote} note=${datedNote}/>

      <div class=${`rise r1`} style=${`margin-top:${datedNote?22:34}px`}>
        ${/* On a period day the hero IS the bleed day, so the kicker must not
             also quote a cycle day — two different "day N" on one screen reads
             as a bug. */''}
        <div class="kicker" style="color:var(--accent)">
          ${onPeriod ? 'Period' : `${PHASES[phase].label}${cycleDay?` · day ${cycleDay}`:''}`}</div>
        <div style="display:flex;align-items:flex-end;gap:13px;margin-top:5px">
          <div class="hero-n">${hero}</div>
          <div style="padding-bottom:18px;font-size:15px;line-height:1.26;
               color:var(--ink-2);font-weight:450">${heroSub}</div>
        </div>
        ${onPeriod
          ? html`<div style="font-size:13.5px;color:var(--ink-2);margin-top:9px">
              Flow <strong style="color:var(--ink);font-weight:600">
              ${FLOWS.find(f=>f.id===flow).label}</strong>
              ${pred.avg?` · ${pred.avg}-day cycle`:''}</div>`
          : pred.next && html`
            <div style="font-size:13.5px;color:var(--ink-2);margin-top:9px">
              Expected <strong style="color:var(--ink);font-weight:600">
              ${pred.next.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</strong>
              ${pred.avg?` · ${pred.avg}-day cycle`:''}</div>`}
      </div>

      ${pred.last && html`
        <div class="rise r2" style="margin-top:30px">
          <div class="kicker" style="color:var(--ink-3);margin-bottom:11px">Your cycle</div>
          <${CycleStrip} pred=${pred} pLogs=${pLogs} today=${today} onPick=${onPickDay}/>
        </div>`}

      <div class="card rise r3" style="margin-top:26px">
        <div class="kicker" style="color:var(--accent);margin-bottom:8px">From Afaq</div>
        <div class="serif" style="font-size:21px;line-height:1.34">${note}</div>
      </div>

      <div class="rise r4" style="display:flex;gap:9px;margin-top:12px">
        <button class="pill" style="flex:1" onClick=${onOpenDay}>
          ${moods.length
            ? html`<${MoodFace} mood=${moods[0]} size=${22}/> ${moods[0]}`
            : html`<div style="width:20px;height:20px"><${Icon} n="plus"/></div> Mood`}
        </button>
        <button class=${`pill ${onPeriod?'pill-solid':''}`} style="flex:1" onClick=${onOpenDay}>
          ${onPeriod ? FLOWS.find(f=>f.id===flow).label : 'Log period'}
        </button>
      </div>

      <div class="card rise r5" style="margin-top:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="kicker" style="color:var(--ink-3)">Weight</div>
          <button onClick=${onWeight} style="display:flex;align-items:center;gap:5px;
            font-size:12.5px;font-weight:600;color:var(--accent)">
            <span style="width:14px;height:14px;display:block"><${Icon} n="plus" w=${2.4}/></span>
            ${weights[tk] != null ? 'Update' : 'Log'}</button>
        </div>
        ${Object.keys(weights).length >= 2
          ? html`<${WeightChart} weights=${weights} pLogs=${pLogs} unit=${unit}/>`
          : html`<div style="font-size:14px;color:var(--ink-2);line-height:1.5">
              ${Object.keys(weights).length === 1
                ? `First entry saved. Log again tomorrow and the trend appears here.`
                : `Log your weight and watch how it moves with your cycle.`}</div>`}
      </div>

      ${pred.cycles.length > 0 && html`
        <div class="card rise r5">
          <div class="kicker" style="color:var(--ink-3);margin-bottom:12px">Patterns</div>
          <div style="display:flex;gap:16px">
            <${Stat} v=${pred.avg} l="Average" u="days"/>
            <${Stat} v=${pred.cycles.length+1} l="Tracked" u="cycles"/>
            <${Stat} v=${regularity(pred.cycles)} l="Regularity"/>
          </div>
        </div>`}

      <div class="pad-nav"></div>
    </div>`;
}
let nickStable = nick();
const Stat = ({ v, l, u }) => html`
  <div style="flex:1;min-width:0">
    <div style="font-family:var(--display);font-size:30px;font-weight:300;
         letter-spacing:-1px;line-height:1">${v}</div>
    <div style="font-size:11.5px;color:var(--ink-3);margin-top:3px">${l}${u?` · ${u}`:''}</div>
  </div>`;
function regularity(c){
  if (c.length < 2) return "—";
  const m = c.reduce((a,b)=>a+b,0)/c.length;
  const sd = Math.sqrt(c.reduce((s,x)=>s+(x-m)**2,0)/c.length);
  return sd <= 2 ? "High" : sd <= 5 ? "Fair" : "Low";
}

/* ═══ CYCLE ═══════════════════════════════════════════════════ */
function Cycle({ pLogs, mLogs, weights, pred, sel, setSel, onOpen, unit }){
  const [m,setM] = useState(new Date().getMonth());
  const [y,setY] = useState(new Date().getFullYear());
  const today = new Date();
  const cells = useMemo(()=>{
    const first = new Date(y,m,1).getDay(), len = new Date(y,m+1,0).getDate(), out=[];
    for (let i=0;i<first;i++) out.push(null);
    for (let d=1;d<=len;d++) out.push(new Date(y,m,d));
    return out;
  },[m,y]);
  const status = useCallback(d=>{
    const k = dk(d);
    if (isPeriodFlow(pLogs[k]&&pLogs[k].flow)) return 'period';
    if (pred.ovDay && sameD(d,pred.ovDay)) return 'ovul';
    if (pred.fertile && d>=pred.fertile.start && d<=pred.fertile.end) return 'fertile';
    if (pred.next) for(let i=0;i<pred.runLen;i++) if(sameD(d,addD(pred.next,i))) return 'predicted';
    return null;
  },[pLogs,pred]);
  const shift = n => { let nm=m+n, ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} setM(nm); setY(ny); };

  return html`
    <div class="scroll">
      <div style="height:calc(var(--safe-t) + 14px)"></div>
      <div class="kicker" style="color:var(--ink-3)">Cycle</div>

      <div class="card rise" style="margin-top:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <button onClick=${()=>shift(-1)} aria-label="Previous month"
            style="width:32px;height:32px;padding:7px"><${Icon} n="back"/></button>
          <div class="serif" style="font-size:20px">${MONTH_FULL[m]} ${y}</div>
          <button onClick=${()=>shift(1)} aria-label="Next month"
            style="width:32px;height:32px;padding:7px;transform:rotate(180deg)">
            <${Icon} n="back"/></button>
        </div>
        <div class="cal">${DOW.map((d,i)=>html`<div class="cal-dow" key=${i}>${d}</div>`)}</div>
        <div class="cal">
          ${cells.map((d,i)=>{
            if(!d) return html`<div key=${'e'+i}></div>`;
            const k = dk(d), st = status(d);
            const flow = pLogs[k] && pLogs[k].flow;
            const bg = st==='period' ? DAYCOL.period
              : st==='ovul' ? DAYCOL.ovul
              : st==='fertile' ? 'rgba(55,168,143,.22)'
              : st==='predicted' ? 'transparent' : 'transparent';
            const fg = (st==='period'||st==='ovul') ? '#fff' : 'var(--ink)';
            const op = st==='period'&&flow ? (FLOWS.find(f=>f.id===flow)||{o:1}).o : 1;
            return html`
              <button class="day" key=${k} data-today=${sameD(d,today)?'1':'0'}
                data-sel=${sameD(d,sel)?'1':'0'}
                style=${`background:${bg};color:${fg};opacity:${op};
                  ${st==='predicted'?`box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)`:''}`}
                onClick=${()=>{ setSel(d); onOpen(); }}
                aria-label=${`${d.getDate()} ${MONTH_FULL[m]}`}>
                ${d.getDate()}
                ${(mLogs[k]||[]).length>0 && html`
                  <span class="dot" style=${`background:${fg};opacity:.55`}></span>`}
              </button>`;
          })}
        </div>
      </div>

      ${Object.keys(weights).length>=2 && html`
        <div class="card rise r1">
          <div class="kicker" style="color:var(--ink-3);margin-bottom:12px">
            Weight & cycle</div>
          <${WeightChart} weights=${weights} pLogs=${pLogs} unit=${unit}/>
          <div style="font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.5">
            Pink bands mark bleeding days. Many people gain a little in the week before —
            seeing it helps it feel normal.</div>
        </div>`}
      <div class="pad-nav"></div>
    </div>`;
}

/* ═══ Day sheet ═══════════════════════════════════════════════ */
function DaySheet({ open, onClose, date, pLogs, setPLogs, mLogs, setMLogs,
                    sLogs, setSLogs, dayNotes, setDayNotes, weights, unit, onWeight, toast }){
  const k = dk(date);
  const flow = (pLogs[k]||{}).flow || null;
  const moods = mLogs[k] || [];
  const syms = sLogs[k] || [];
  const setFlow = id => {
    const was = flow;
    setPLogs(p=>({ ...p, [k]:{ ...p[k], flow: p[k]&&p[k].flow===id ? null : id } }));
    if (!was) toast(`Logged · take it easy, ${nick()}`);
  };
  const tog = setter => v => setter(p=>{
    const cur = p[k]||[];
    return { ...p, [k]: cur.includes(v) ? cur.filter(x=>x!==v) : [...cur,v] };
  });
  return html`
    <${Sheet} open=${open} onClose=${onClose}>
      <div class="serif" style="font-size:26px;letter-spacing:-.5px">
        ${date.getDate()} ${MONTH_FULL[date.getMonth()]}</div>
      <div style="font-size:13px;color:var(--ink-2);margin-bottom:22px">
        ${sameD(date,new Date())?'Today':date.toLocaleDateString(undefined,{weekday:'long'})}</div>

      <div class="kicker" style="color:var(--ink-3);margin-bottom:10px">Flow</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
        ${FLOWS.map(f=>html`<button key=${f.id} class="chip" data-on=${flow===f.id?'1':'0'}
          onClick=${()=>setFlow(f.id)}>${f.label}</button>`)}
      </div>

      <div class="kicker" style="color:var(--ink-3);margin-bottom:10px">Mood</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
        ${MOODS.map(mo=>html`
          <button key=${mo.label} class="chip" data-on=${moods.includes(mo.label)?'1':'0'}
            onClick=${()=>tog(setMLogs)(mo.label)}>
            <${MoodFace} mood=${mo.label} size=${20}/>${mo.label}</button>`)}
      </div>

      <div class="kicker" style="color:var(--ink-3);margin-bottom:10px">Symptoms</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
        ${SYMPTOMS.map(s=>html`<button key=${s} class="chip" data-on=${syms.includes(s)?'1':'0'}
          onClick=${()=>tog(setSLogs)(s)}>${s}</button>`)}
      </div>

      <div class="kicker" style="color:var(--ink-3);margin-bottom:10px">Weight</div>
      <button class="pill" style="width:100%;margin-bottom:24px;justify-content:space-between"
        onClick=${onWeight}>
        <span style="display:flex;align-items:center;gap:9px">
          <span style="width:19px;height:19px;display:block;color:var(--accent)">
            <${Icon} n="scale"/></span>
          ${weights[k] != null ? `${weights[k].toFixed(1)} ${unit}` : 'Not logged'}</span>
        <span style="color:var(--accent);font-weight:600;font-size:13.5px">
          ${weights[k] != null ? 'Change' : 'Add'}</span>
      </button>

      <div class="kicker" style="color:var(--ink-3);margin-bottom:10px">Journal</div>
      <textarea value=${dayNotes[k]||''} placeholder="How was today?"
        onInput=${e=>{ const v=e.target.value; setDayNotes(p=>({...p,[k]:v})); }}
        style="width:100%;min-height:96px;background:var(--fill);border-radius:18px;
               padding:14px 16px;font-size:15px;line-height:1.5;resize:none;margin-bottom:24px"></textarea>

      <button class="pill pill-solid" style="width:100%" onClick=${onClose}>Done</button>
    <//>`;
}

/* ═══ CHAT ════════════════════════════════════════════════════ */
function Chat({ msgs, setMsgs, apiKey, pred, cycleDay, mLogs, toast }){
  const [input,setInput] = useState('');
  const [busy,setBusy] = useState(false);
  const end = useRef(null);
  useEffect(()=>{ end.current && end.current.scrollIntoView({behavior:'smooth'}); },[msgs,busy]);
  const send = async () => {
    const text = input.trim();
    if (!text || busy) return;
    if (!apiKey){ toast('Add a Gemini key in Settings first'); return; }
    setInput('');
    const next = [...msgs,{role:'user',content:text}];
    setMsgs(next); setBusy(true);
    const recent = Object.keys(mLogs).sort().slice(-3)
      .map(d=>`${d}: ${(mLogs[d]||[]).join(', ')}`).join(' | ');
    const sys = `You are Wyar, a warm companion for Gullalay. She is on day ${cycleDay||'?'} `
      + `of her cycle; next period ${pred.next?dk(pred.next):'unknown'}. Recent moods: `
      + `${recent||'none'}. Be gentle, brief and human. Occasionally use a nickname like `
      + `${nick()}. Never diagnose; suggest a doctor for anything serious.`;
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
        { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            systemInstruction:{parts:[{text:sys}]},
            contents: next.slice(-20).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]})),
            generationConfig:{temperature:.9,maxOutputTokens:500} })});
      const j = await r.json();
      if (!r.ok) throw new Error((j.error&&j.error.message)||`HTTP ${r.status}`);
      const reply = j.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!reply) throw new Error('Empty response');
      setMsgs(m=>[...m,{role:'ai',content:reply.trim()}].slice(-100));
    }catch(e){
      toast(`Wyar couldn't reply — ${e.message}`);
      setMsgs(m=>m.slice(0,-1)); setInput(text);
    }finally{ setBusy(false); }
  };
  return html`
    <div style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div style="height:calc(var(--safe-t) + 14px);flex:none"></div>
      <div style="padding:0 20px 8px;flex:none">
        <div class="kicker" style="color:var(--ink-3)">Wyar</div>
      </div>
      <div class="scroll" style="display:flex;flex-direction:column;gap:9px">
        ${msgs.length===0 && html`
          <div style="text-align:center;padding:46px 22px">
            <div class="serif" style="font-size:22px;margin-bottom:8px">Hi, I'm Wyar</div>
            <div style="font-size:15px;color:var(--ink-2);line-height:1.5">
              Here whenever you want to talk — about how you're feeling, or nothing at all.</div>
          </div>`}
        ${msgs.map((m,i)=>html`<div key=${i}
          class=${`bubble ${m.role==='user'?'bubble-me':'bubble-ai'}`}>${m.content}</div>`)}
        ${busy && html`<div class="bubble bubble-ai" style="display:flex;gap:5px;padding:15px 18px">
          ${[0,1,2].map(i=>html`<span key=${i} style=${`width:7px;height:7px;border-radius:50%;
            background:var(--ink-2);animation:blink 1.3s ${i*0.16}s infinite`}></span>`)}</div>`}
        <div ref=${end}></div>
        <div style="height:calc(150px + var(--safe-b))"></div>
      </div>
      <div style="position:fixed;left:20px;right:20px;bottom:calc(var(--safe-b) + 88px);
           display:flex;gap:9px;z-index:30">
        <input value=${input} placeholder="Message Wyar"
          onInput=${e=>setInput(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()}
          style="flex:1;background:var(--card);border:1px solid var(--card-line);
                 border-radius:999px;padding:13px 19px;font-size:16px;
                 -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)"/>
        <button class="pill pill-solid" aria-label="Send" onClick=${send}
          style=${`width:48px;height:48px;border-radius:50%;padding:11px;flex:none;
            opacity:${input.trim()?1:.45}`}><${Icon} n="send" w=${2.2}/></button>
      </div>
    </div>`;
}

  { id:'yellow',  bg:'#FFF6D6', ink:'#463A11' }, { id:'orange', bg:'#FFEBDA', ink:'#4A2A12' },
];
function Notes({ toast }){
  const [notes,setNotes] = useLS('keeper_notes', []);
  const [edit,setEdit] = useState(null);
  const [q,setQ] = useState('');
  const shown = useMemo(()=>{
    const s = q.trim().toLowerCase();
    const list = [...notes].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    return !s ? list : list.filter(n=>(n.title||'').toLowerCase().includes(s)
      || (n.body||'').toLowerCase().includes(s));
  },[notes,q]);
  const save = () => {
    if (!edit.title.trim() && !edit.body.trim()){ setEdit(null); return; }
    const now = Date.now();
    setNotes(ns=>edit.id ? ns.map(n=>n.id===edit.id?{...edit,updatedAt:now}:n)
      : [...ns,{...edit,id:String(now),createdAt:now,updatedAt:now}]);
    setEdit(null); toast('Saved');
  };
  return html`
    <div class="scroll">
      <div style="height:calc(var(--safe-t) + 14px)"></div>
      <div class="kicker" style="color:var(--ink-3);margin-bottom:12px">Notes</div>
      <input value=${q} placeholder="Search" onInput=${e=>setQ(e.target.value)}
        style="width:100%;background:var(--fill);border-radius:14px;padding:11px 15px;
               margin-bottom:14px;font-size:15px"/>
      ${shown.length===0 && html`<div style="text-align:center;padding:56px 20px;
        color:var(--ink-2);font-size:15px">${q?'Nothing matches':'No notes yet'}</div>`}
      <div style="columns:2;column-gap:11px">
        ${shown.map(n=>{
          const t = TINTS.find(x=>x.id===n.color)||TINTS[0];
          return html`
            <button key=${n.id} onClick=${()=>setEdit({...n})}
              style=${`break-inside:avoid;width:100%;margin-bottom:11px;text-align:left;
                background:${t.bg};color:${t.ink};border-radius:20px;padding:15px;
                border:1px solid ${n.color&&n.color!=='default'?'transparent':'var(--card-line)'};
                box-shadow:0 6px 18px rgba(0,0,0,.06)`}>
              ${n.title && html`<div style="font-weight:600;font-size:15.5px;margin-bottom:5px;
                letter-spacing:-.2px">${n.title}</div>`}
              ${n.body && html`<div style="font-size:13px;opacity:.75;line-height:1.46;
                max-height:130px;overflow:hidden;white-space:pre-wrap">${n.body}</div>`}
            </button>`;
        })}
      </div>
      <div class="pad-nav"></div>

      <button class="pill pill-solid" aria-label="New note"
        onClick=${()=>setEdit({title:'',body:'',color:'default'})}
        style="position:fixed;right:22px;bottom:calc(var(--safe-b) + 90px);width:54px;
               height:54px;border-radius:50%;padding:15px;z-index:35;
               box-shadow:0 8px 24px rgba(0,0,0,.25)"><${Icon} n="plus" w=${2.4}/></button>

      <${Sheet} open=${!!edit} onClose=${save}>
        ${edit && html`
          <input value=${edit.title} placeholder="Title"
            onInput=${e=>setEdit({...edit,title:e.target.value})}
            class="serif" style="width:100%;font-size:25px;padding:2px 0 10px"/>
          <textarea value=${edit.body} placeholder="Write something…"
            onInput=${e=>setEdit({...edit,body:e.target.value})}
            style="width:100%;min-height:180px;font-size:16px;line-height:1.5;resize:none;
                   padding-bottom:12px"></textarea>
          <div style="display:flex;gap:9px;margin:6px 0 18px;flex-wrap:wrap">
            ${TINTS.map(t=>html`<button key=${t.id} onClick=${()=>setEdit({...edit,color:t.id})}
              aria-label=${t.id} style=${`width:31px;height:31px;border-radius:50%;background:${t.bg};
                box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)${edit.color===t.id
                  ?',0 0 0 2.5px var(--accent)':''}`}></button>`)}
          </div>
          <div style="display:flex;gap:10px">
            ${edit.id && html`<button class="pill" style="flex:none;color:var(--accent)"
              onClick=${()=>{ setNotes(ns=>ns.filter(n=>n.id!==edit.id)); setEdit(null); toast('Deleted'); }}>
              Delete</button>`}
            <button class="pill pill-solid" style="flex:1" onClick=${save}>Done</button>
          </div>`}
      <//>
    </div>`;
}

/* ═══ VAULT — salt is fixed forever ═══════════════════════════ */
const VAULT_SALT = 'gullalay_vault_2024';
async function hashPw(pw){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw+VAULT_SALT));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function Vault({ toast }){
  const [vhash,setVhash] = useLS('vault_hash', null);
  const [photos,setPhotos] = useLS('vault_photos', []);
  const [open,setOpen] = useState(false);
  const [pw,setPw] = useState(''); const [pw2,setPw2] = useState('');
  const [view,setView] = useState(null);
  const file = useRef(null);
  /* Auto-lock when she leaves the app — an unlocked vault left open
     on a shared phone defeats the point. */
  useEffect(()=>{
    const onHide = () => { if (document.visibilityState === 'hidden') setOpen(false); };
    document.addEventListener('visibilitychange', onHide);
    return ()=>document.removeEventListener('visibilitychange', onHide);
  },[]);
  const unlock = async () => {
    if (await hashPw(pw) === vhash){ setOpen(true); setPw(''); }
    else { toast('Wrong password'); setPw(''); }
  };
  const create = async () => {
    if (pw.length<4) return toast('At least 4 characters');
    if (pw!==pw2) return toast("Passwords don't match");
    setVhash(await hashPw(pw)); setOpen(true); setPw(''); setPw2(''); toast('Vault created');
  };
  const add = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { setPhotos(p=>[...p,{id:String(Date.now()),src:r.result,name:f.name,
      addedAt:Date.now(),caption:''}]); toast('Photo added'); };
    r.readAsDataURL(f); e.target.value='';
  };
  if (!open) return html`
    <div class="scroll" style="display:flex;flex-direction:column;align-items:center;
         justify-content:center;text-align:center;padding:0 34px">
      <div style="width:70px;height:70px;border-radius:50%;background:var(--fill);
           display:flex;align-items:center;justify-content:center;margin-bottom:18px;
           color:var(--ink-2);padding:21px"><${Icon} n="lock"/></div>
      <div class="serif" style="font-size:25px">${vhash?'Locked':'Create your vault'}</div>
      <div style="font-size:14.5px;color:var(--ink-2);margin:8px 0 22px">
        ${vhash?`${photos.length} ${photos.length===1?'photo':'photos'}`
               :'A private space, protected by a password'}</div>
      <input type="password" value=${pw} placeholder="Password"
        onInput=${e=>setPw(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&vhash&&unlock()}
        style="width:100%;background:var(--card);border:1px solid var(--card-line);
               border-radius:18px;padding:14px 16px;text-align:center;margin-bottom:10px"/>
      ${!vhash && html`<input type="password" value=${pw2} placeholder="Confirm password"
        onInput=${e=>setPw2(e.target.value)}
        style="width:100%;background:var(--card);border:1px solid var(--card-line);
               border-radius:18px;padding:14px 16px;text-align:center;margin-bottom:10px"/>`}
      <button class="pill pill-solid" style="width:100%"
        onClick=${vhash?unlock:create}>${vhash?'Unlock':'Create vault'}</button>
    </div>`;
  return html`
    <div class="scroll">
      <div style="height:calc(var(--safe-t) + 14px)"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="kicker" style="color:var(--ink-3)">
          ${photos.length} ${photos.length===1?'photo':'photos'}</div>
        <button class="chip" onClick=${()=>setOpen(false)}>Lock</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">
        ${photos.map(p=>html`<button key=${p.id} onClick=${()=>setView(p)}
          style="aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--fill)">
          <img src=${p.src} alt=${p.caption||'Photo'} loading="lazy"
            style="width:100%;height:100%;object-fit:cover"/></button>`)}
      </div>
      ${photos.length===0 && html`<div style="text-align:center;padding:56px 20px;
        color:var(--ink-2);font-size:15px">Nothing here yet</div>`}
      <div class="pad-nav"></div>
      <input ref=${file} type="file" accept="image/*" onChange=${add} style="display:none"/>
      <button class="pill pill-solid" aria-label="Add photo" onClick=${()=>file.current.click()}
        style="position:fixed;right:22px;bottom:calc(var(--safe-b) + 90px);width:54px;height:54px;
               border-radius:50%;padding:15px;z-index:35;box-shadow:0 8px 24px rgba(0,0,0,.25)">
        <${Icon} n="plus" w=${2.4}/></button>
      ${view && html`
        <div class="scrim" style="background:rgba(0,0,0,.95);display:flex;flex-direction:column;
             z-index:60" onClick=${()=>setView(null)}>
          <img src=${view.src} alt=${view.caption||'Photo'}
            style="flex:1;object-fit:contain;min-height:0;padding:56px 12px 12px"/>
          <div style="padding:0 20px calc(var(--safe-b) + 24px);color:#fff"
               onClick=${e=>e.stopPropagation()}>
            <input value=${view.caption} placeholder="Add a caption"
              onInput=${e=>{ const c=e.target.value; setView({...view,caption:c});
                setPhotos(ps=>ps.map(x=>x.id===view.id?{...x,caption:c}:x)); }}
              style="width:100%;background:rgba(255,255,255,.13);border-radius:14px;
                     padding:12px 15px;color:#fff;margin-bottom:12px"/>
            <button class="pill" style="width:100%;background:rgba(255,255,255,.15);color:#fff;
              border-color:transparent" onClick=${()=>{ setPhotos(ps=>ps.filter(x=>x.id!==view.id));
                setView(null); toast('Deleted'); }}>Delete photo</button>
          </div>
        </div>`}
    </div>`;
}

/* ═══ SETTINGS ════════════════════════════════════════════════ */
function Settings({ appearance, setAppearance, unit, setUnit, apiKey, setApiKey,
                    phase, isDark, toast }){
  const [draft,setDraft] = useState(apiKey);
  const fileRef = useRef(null);
  const exportData = () => {
    const dump = { _app:'gullalay-companion', _version:2, _exported:new Date().toISOString(), data:{} };
    BACKUP_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null) dump.data[k]=v; });
    const blob = new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gullalay-backup-${dk(new Date())}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup saved');
  };
  const importData = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const j = JSON.parse(r.result);
        if (j._app !== 'gullalay-companion') throw new Error('Not a Gullalay backup');
        const n = Object.keys(j.data).length;
        if (!confirm(`Restore ${n} items? This replaces everything on this device.`)) return;
        Object.keys(j.data).forEach(k=>localStorage.setItem(k,j.data[k]));
        location.reload();
      }catch(err){ toast(`Couldn't restore — ${err.message}`); }
    };
    r.readAsText(f); e.target.value='';
  };
  const Group = ({ title, children }) => html`
    <div class="kicker" style="color:var(--ink-3);padding:24px 4px 9px">${title}</div>
    <div class="card" style="padding:6px 0">${children}</div>`;
  const Row = ({ children, onClick }) => html`
    <button onClick=${onClick} style="display:flex;align-items:center;gap:12px;width:100%;
      padding:13px 18px;text-align:left;min-height:50px">${children}</button>`;

  return html`
    <div class="scroll">
      <div style="height:calc(var(--safe-t) + 14px)"></div>
      <div class="kicker" style="color:var(--ink-3)">Settings</div>

      <${Group} title="Appearance">
        <div style="padding:12px 18px">
          <div style="display:flex;gap:3px;background:var(--fill);border-radius:13px;padding:3px">
            ${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([id,l])=>html`
              <button key=${id} onClick=${()=>setAppearance(id)}
                style=${`flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;
                  background:${appearance===id?'var(--card)':'transparent'};
                  color:${appearance===id?'var(--ink)':'var(--ink-2)'};
                  box-shadow:${appearance===id?'0 1px 4px rgba(0,0,0,.1)':'none'}`}>${l}</button>`)}
          </div>
          <div style="font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.5">
            Auto follows the time of day — light from 6am, dark from 7pm.
            Right now it's <strong style="color:var(--ink-2)">${isDark?'dark':'light'}</strong>.
          </div>
        </div>
        <div style="padding:4px 18px 14px;box-shadow:inset 0 .5px 0 var(--card-line)">
          <div style="font-size:12.5px;color:var(--ink-3);margin-top:12px;line-height:1.5">
            Colour follows your cycle. You're in the
            <strong style="color:var(--accent)">${PHASES[phase].label.toLowerCase()}</strong> phase.
          </div>
        </div>
      <//>

      <${Group} title="Units">
        <div style="padding:12px 18px">
          <div style="display:flex;gap:3px;background:var(--fill);border-radius:13px;padding:3px">
            ${['kg','lb'].map(u=>html`
              <button key=${u} onClick=${()=>setUnit(u)}
                style=${`flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;
                  background:${unit===u?'var(--card)':'transparent'};
                  color:${unit===u?'var(--ink)':'var(--ink-2)'}`}>${u}</button>`)}
          </div>
        </div>
      <//>

      <${Group} title="Data">
        <${Row} onClick=${exportData}>
          <span style="width:20px;height:20px;color:var(--accent);flex:none">
            <${Icon} n="up"/></span>
          <span style="flex:1;font-size:16px">Export backup</span>
        <//>
        <div style="box-shadow:inset 0 .5px 0 var(--card-line)">
          <${Row} onClick=${()=>fileRef.current.click()}>
            <span style="width:20px;height:20px;color:var(--accent);flex:none">
              <${Icon} n="down"/></span>
            <span style="flex:1;font-size:16px">Restore from backup</span>
          <//>
        </div>
      <//>
      <div style="font-size:12.5px;color:var(--ink-3);padding:10px 6px 0;line-height:1.55">
        Everything stays on this phone. Export now and then — if Safari clears its
        storage, a backup is the only way back.
      </div>

      <${Group} title="Wyar">
        <div style="padding:12px 18px 16px">
          <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:10px;line-height:1.5">
            Wyar needs a free Gemini key from aistudio.google.com/apikey
          </div>
          <input value=${draft} type="password" placeholder="Paste key"
            onInput=${e=>setDraft(e.target.value)}
            style="width:100%;background:var(--fill);border-radius:14px;padding:12px 15px;
                   margin-bottom:10px;font-size:14.5px"/>
          <button class="pill" style="width:100%;color:var(--accent)"
            onClick=${()=>{ setApiKey(draft.trim()); toast('Key saved'); }}>Save key</button>
        </div>
      <//>

      <div style="text-align:center;padding:36px 0 8px;color:var(--ink-3);
           font-size:12.5px;line-height:1.7">
        <${Avatar} size=${38}/>
        <div style="margin-top:10px">Made for Gullalay<br/>with love, by Afaq</div>
      </div>
      <input ref=${fileRef} type="file" accept="application/json" onChange=${importData}
        style="display:none"/>
      <div class="pad-nav"></div>
    </div>`;
}

/* ═══ ROOT ════════════════════════════════════════════════════ */
const TABS = [
  { id:'home',  label:'Today', icon:'home' }, { id:'cycle', label:'Cycle', icon:'cal'  },
  { id:'chat',  label:'Wyar',  icon:'chat' }, { id:'notes', label:'Notes', icon:'note' },
  { id:'vault', label:'Vault', icon:'lock' }, { id:'more',  label:'More',  icon:'gear' },
];

/* Auto appearance follows the clock: light 06:00–18:59, dark otherwise. */
const isNight = () => { const h = new Date().getHours(); return h < 6 || h >= 19; };

function App(){
  const [tab,setTab] = useState('home');
  const [pLogs,setPLogs] = useLS('pLogs', {});
  const [mLogs,setMLogs] = useLS('mLogs', {});
  const [sLogs,setSLogs] = useLS('sLogs', {});
  const [dayNotes,setDayNotes] = useLS('notes', {});   /* legacy per-day journal */
  const [weights,setWeights] = useLS('weight', {});
  const [msgs,setMsgs] = useLS('chat', []);
  const [apiKey,setApiKey] = useLS('geminiKey', '');
  const [appearance,setAppearance] = useLS('appearance', 'auto');
  const [unit,setUnit] = useLS('unit', 'kg');

  const [sel,setSel] = useState(new Date());
  const [sheet,setSheet] = useState(false);
  const [wSheet,setWSheet] = useState(false);
  const [toastNode,toast] = useToast();
  const [night,setNight] = useState(isNight());
  const [tick,setTick] = useState(0);
  const noteSeed = useMemo(()=>Math.floor(Math.random()*997),[]);
  const datedNote = useMemo(()=>activeDatedNote(new Date()),[tick]);

  const today = new Date();
  const pred = useMemo(()=>predict(pLogs),[pLogs]);
  const cycleDay = pred.last ? dBetween(pred.last, today)+1 : 0;
  const onPeriod = isPeriodFlow((pLogs[dk(today)]||{}).flow);
  const phase = phaseOf(pred, cycleDay, onPeriod);
  const isDark = appearance==='dark' || (appearance==='auto' && night);

  /* One clock for the whole app: flips Auto light/dark, and expires a dated
     note at its exact minute without needing a reload. setNight alone is not
     enough — it bails out when the value is unchanged, so nothing re-renders. */
  useEffect(()=>{
    const t = setInterval(()=>{ setNight(isNight()); setTick(n=>n+1); }, 60000);
    return ()=>clearInterval(t);
  },[]);

  /* Write the phase palette to :root. One place, everything follows. */
  useEffect(()=>{
    const p = PHASES[phase][isDark ? 'dark' : 'light'];
    const r = document.documentElement.style;
    r.setProperty('--g1',p.g1); r.setProperty('--g2',p.g2); r.setProperty('--g3',p.g3);
    r.setProperty('--a1',p.a1); r.setProperty('--a2',p.a2);
    r.setProperty('--accent',p.accent); r.setProperty('--accent-ink',p.accentInk);
    /* A very soft wash of the current accent, for the dated-note letter. */
    const rgb = p.accent.match(/\w\w/g).map(x=>parseInt(x,16));
    r.setProperty('--accent-wash', `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${isDark?.22:.16})`);
    r.setProperty('--ink',p.ink); r.setProperty('--ink-2',p.ink2); r.setProperty('--ink-3',p.ink3);
    r.setProperty('--card',p.card); r.setProperty('--card-line',p.line);
    r.setProperty('--nav',p.nav); r.setProperty('--fill',p.fill);
    r.setProperty('--idle', isDark?'rgba(255,255,255,.1)':'rgba(0,0,0,.09)');
    r.setProperty('--nav-ink', isDark?'rgba(255,255,255,.5)':'rgba(255,255,255,.55)');
    r.setProperty('--nav-active', isDark ? p.accent : '#FFFFFF');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', p.g2);
  },[phase,isDark]);

  const openDay = d => { if(d) setSel(d); else setSel(new Date()); setSheet(true); };

  return html`
    <div class="screen">
      ${tab==='home' && html`<${Home} pred=${pred} pLogs=${pLogs} mLogs=${mLogs}
        weights=${weights} unit=${unit} today=${today} cycleDay=${cycleDay} phase=${phase}
        noteSeed=${noteSeed} datedNote=${datedNote}
        onOpenDay=${()=>openDay()} onPickDay=${openDay}
        onWeight=${()=>{ setSel(new Date()); setWSheet(true); }}/>`}
      ${tab==='cycle' && html`<${Cycle} pLogs=${pLogs} mLogs=${mLogs} weights=${weights}
        pred=${pred} sel=${sel} setSel=${setSel} onOpen=${()=>setSheet(true)} unit=${unit}/>`}
      ${tab==='chat' && html`<${Chat} msgs=${msgs} setMsgs=${setMsgs} apiKey=${apiKey}
        pred=${pred} cycleDay=${cycleDay} mLogs=${mLogs} toast=${toast}/>`}
      ${tab==='notes' && html`<${Notes} toast=${toast}/>`}
      ${tab==='vault' && html`<${Vault} toast=${toast}/>`}
      ${tab==='more' && html`<${Settings} appearance=${appearance} setAppearance=${setAppearance}
        unit=${unit} setUnit=${setUnit} apiKey=${apiKey} setApiKey=${setApiKey}
        phase=${phase} isDark=${isDark} toast=${toast}/>`}

      <${DaySheet} open=${sheet} onClose=${()=>setSheet(false)} date=${sel}
        pLogs=${pLogs} setPLogs=${setPLogs} mLogs=${mLogs} setMLogs=${setMLogs}
        sLogs=${sLogs} setSLogs=${setSLogs} dayNotes=${dayNotes} setDayNotes=${setDayNotes}
        weights=${weights} unit=${unit} onWeight=${()=>{ setSheet(false); setWSheet(true); }}
        toast=${toast}/>
      <${WeightSheet} open=${wSheet} onClose=${()=>setWSheet(false)} date=${sel}
        weights=${weights} setWeights=${setWeights} unit=${unit} toast=${toast}/>

      ${toastNode}

      <nav class="nav">
        ${TABS.map(t=>html`
          <button key=${t.id} data-on=${tab===t.id?'1':'0'} onClick=${()=>setTab(t.id)}
            aria-label=${t.label} aria-current=${tab===t.id?'page':null}>
            <span style="width:21px;height:21px;display:block">
              <${Icon} n=${t.icon} w=${tab===t.id?2.3:1.9}/></span>
            <span>${t.label}</span>
          </button>`)}
      </nav>
    </div>`;
}

render(html`<${App}/>`, document.getElementById('app'));
if ('serviceWorker' in navigator)
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
